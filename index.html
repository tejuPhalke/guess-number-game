<!DOCTYPE html>
<html lang="en">
<head>

    <title>Number guessing game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="proj4">
    <div id="wrapper">
    <h1>Number guessing game</h1>
    <p>Try and guess a random number between 1 to 100</p>
    <p>You have 10 attempts to guess the right number</p>
</br>
<div class="form">
<form action="#" >
<lable for="guessField">Enter your guess: </label>
<input type="text" id="guessField" class="guessField" autocomplete="off">
<br></br>
<input type="submit" id="subt" value="Submit guess" class="guessSubmit">
</form>
</div>
<div class="resultParas">
    <p>Previous Guesses: <span class="guesses"></span></p>
    <p>Gusses Remaining<span class="lastResult">10</span></p>
    <p class="lowOrhi"></p>
</div>
</div>
<script src="./script.js"></script>
</body>
</html>
